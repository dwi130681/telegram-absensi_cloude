<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Absensi Pro</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{color-scheme:light dark;--bg:var(--tg-theme-bg-color,#f2f6f7);--card:var(--tg-theme-secondary-bg-color,#fff);--tx:var(--tg-theme-text-color,#13222b);--mut:var(--tg-theme-hint-color,#6b7a85);
--pri:#0b7a75;--pt:#fff;--ok:#1e9e5a;--warn:#d9820b;--err:#d63c3c;--info:#2b6fd1;--bd:rgba(110,125,135,.22);--r:16px;
--font:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif}
@media(prefers-color-scheme:dark){:root:not(.tg){--bg:#0e1519;--card:#16222a;--tx:#e8eef1;--mut:#8b9ba6;--pri:#2bb3ab;--pt:#06201f}}
:root[data-mode=light]{color-scheme:light;--bg:#f2f6f7;--card:#fff;--tx:#13222b;--mut:#6b7a85}
:root[data-mode=dark]{color-scheme:dark;--bg:#0e1519;--card:#16222a;--tx:#e8eef1;--mut:#8b9ba6}
:root[data-dense="1"] .card{padding:10px;margin-bottom:8px}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}.sw.on{border-color:var(--tx)}
#off{background:var(--err);color:#fff;text-align:center;padding:5px;font-size:13px}
*{box-sizing:border-box}html,body{margin:0}body{font:var(--fs,15px)/1.5 var(--font);background:var(--bg);color:var(--tx);-webkit-tap-highlight-color:transparent}
h1,h2,h3{margin:0;line-height:1.25}h1{font-size:22px}h2{font-size:19px}h3{font-size:16px}p{margin:6px 0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.shell{display:grid;grid-template-columns:1fr;min-height:100vh}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;padding:6px 2px;border-radius:10px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button i{font-style:normal;font-size:19px}nav button.on{color:var(--pri);font-weight:600;background:color-mix(in srgb,var(--pri) 12%,transparent)}
nav .brand{display:none}
main{padding:16px 14px 92px;max-width:1000px;width:100%;margin:0 auto}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:36px}
.bk{border:0;background:var(--card);border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:18px}
@media(min-width:900px){.shell{grid-template-columns:230px 1fr}
nav{position:sticky;top:0;height:100vh;flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding:18px 12px;gap:4px}
nav .brand{display:block;font-weight:700;font-size:18px;color:var(--pri);padding:4px 10px 16px}
nav button{flex:none;flex-direction:row;font-size:14px;gap:10px;padding:10px 12px;justify-content:flex-start}
main{padding:28px 32px 40px}}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;border:1px solid var(--bd)}
.card.click{cursor:pointer;transition:border-color .15s}.card.click:hover{border-color:var(--pri)}
.hero{border-left:4px solid var(--pri);background:linear-gradient(135deg,color-mix(in srgb,var(--pri) 9%,var(--card)),var(--card) 70%)}
.nudge{font-size:15px;margin:0 0 12px;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--pri) 10%,transparent)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;margin:4px 6px 4px 0;background:color-mix(in srgb,var(--pri) 14%,transparent);color:var(--pri)}
.card{box-shadow:0 1px 2px rgba(20,40,50,.04)}.btn{transition:transform .12s,border-color .15s}.btn:active{transform:scale(.97)}
.grid2{display:grid;gap:12px}.grid3{display:grid;gap:12px}
@media(min-width:760px){.grid2{grid-template-columns:1.4fr 1fr}.grid3{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.gap{justify-content:flex-start}
.muted{color:var(--mut);font-size:13px}.ok{color:var(--ok)}.warn{color:var(--warn)}.err{color:var(--err)}
.btn{border:0;border-radius:10px;padding:9px 14px;background:var(--card);border:1px solid var(--bd);cursor:pointer;font-weight:500}
.btn.pri{background:var(--pri);color:var(--pt);border-color:var(--pri)}.btn.dng{background:var(--err);color:#fff;border-color:var(--err)}.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);margin:4px 0 10px}
label{font-size:13px;color:var(--mut)}
.bd{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;color:#fff;margin:2px 4px 2px 0}
.hadir{background:var(--ok)}.terlambat{background:var(--warn)}.izin{background:var(--info)}.sakit{background:#7b4cc4}.alpa{background:var(--err)}.belum{background:#78858f}
.open{background:var(--ok)}.upcoming{background:#78858f}.ended{background:#8a766b}.closed{background:var(--err)}.grp{background:var(--pri)}
.tabs{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}.tab{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer}
.tab.on{background:var(--pri);color:var(--pt);border-color:var(--pri)}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--bd) 0);display:grid;place-items:center;flex:none}
.ring b{width:70px;height:70px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:20px}
.bar{height:6px;border-radius:3px;background:var(--bd);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
.stat{text-align:center}.stat b{display:block;font-size:24px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}
.tip{border-radius:10px;padding:9px 12px;margin-top:8px;background:color-mix(in srgb,var(--info) 12%,transparent)}
.tip.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:inherit}.tip.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:inherit}
.att{border-top:1px solid var(--bd);padding:8px 0}.att select{width:auto;margin:4px 0 0;padding:4px 8px}
.qr{display:block;width:100%;max-width:340px;margin:10px auto;background:#fff;padding:8px;border-radius:12px;image-rendering:pixelated}
.code{font-size:clamp(40px,9vw,64px);font-weight:700;text-align:center;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.sk{height:76px;border-radius:var(--r);background:linear-gradient(90deg,var(--card),var(--bd),var(--card));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:12px}
@keyframes sk{to{background-position:-200% 0}}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.t{background:#1b2a33;color:#fff;padding:10px 16px;border-radius:12px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}.t.err{background:var(--err)}.t.ok{background:var(--ok)}
.demo{background:var(--warn);color:#fff;padding:6px 12px;font-size:13px;display:flex;justify-content:center;gap:10px;align-items:center}.demo button{border:1px solid #fff;background:none;color:#fff;border-radius:8px;padding:2px 10px;cursor:pointer}
details summary{cursor:pointer;color:var(--pri);margin:6px 0}
.empty{text-align:center;color:var(--mut);padding:28px 8px}
.card{box-shadow:0 1px 2px rgba(19,34,43,.05)}.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--pri) 9%,var(--card)),var(--card))}
.btn{transition:transform .08s,border-color .15s}.btn:active{transform:scale(.97)}
:root[data-style=ramah]{--r:20px;--font:"Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
:root[data-style=ramah] .btn,:root[data-style=ramah] .tab{border-radius:999px}:root[data-style=ramah] input,:root[data-style=ramah] select,:root[data-style=ramah] textarea{border-radius:14px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="demo" class="demo" hidden><span>🧪 Mode pratinjau: data contoh, kode check-in <b>482913</b></span><button id="role"></button></div>
<div id="off" hidden>📡 Kamu sedang offline. Perubahan baru tersimpan setelah internet tersambung.</div>
<div class="shell">
  <nav id="nav"></nav>
  <main><header><button class="bk" id="bk" hidden aria-label="Kembali">‹</button><h1 id="ttl" style="flex:1">Memuat…</h1><button class="bk" id="rf" title="Muat ulang" aria-label="Muat ulang">↻</button><button class="bk" id="thm" title="Tema & tampilan" aria-label="Tema">🎨</button></header><div id="view"></div></main>
</div>
<div id="toast" aria-live="polite"></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbzkfOBvgwJFMP-ReYjvXuVZ6VjFQrSxVIEalZar6u5GklPLRzPYKnQjMk13vixR4xcA/exec';
const tg=(window.Telegram&&Telegram.WebApp)||{};
const UNSET=/GANTI_DENGAN/.test(API_URL);          // API_URL belum diisi = mode pratinjau
const DEMO=!tg.initData&&UNSET;                    // banner pratinjau hanya muncul di sini
const OUTSIDE=!tg.initData&&!UNSET;                // produksi, tapi dibuka di luar Telegram
if(tg.initData){document.documentElement.classList.add('tg');try{tg.ready();tg.expand();tg.disableVerticalSwipes&&tg.disableVerticalSwipes()}catch(e){}}
const $=id=>document.getElementById(id);
const L={hadir:'Hadir',terlambat:'Terlambat',izin:'Izin',sakit:'Sakit',alpa:'Alpa',belum:'Belum'};
const PH={upcoming:'Belum dibuka',open:'Check-in dibuka',ended:'Waktu habis',closed:'Ditutup'};
const SET=['hadir','terlambat','izin','sakit'];
const ACT={'laporan.pdf':'Laporan PDF','acara.buat':'Acara dibuat','acara.ubah':'Acara diubah','acara.hapus':'Acara dihapus','acara.tutup':'Acara ditutup','acara.buka':'Acara dibuka','hadir.ubah':'Status diubah','hadir.hapus':'Catatan dihapus','grup.simpan':'Grup disimpan','grup.hapus':'Grup dihapus','anggota.tambah':'Anggota ditambah','anggota.hapus':'Anggota dihapus','ekspor.acara':'Ekspor acara','ekspor.rekap':'Ekspor rekap'};
const S={view:'home',admin:false,back:null,timer:null,seq:0,busy:false,filter:'active',page:1,q:'',rg:'',rm:''};

/* ---------- tema ---------- */
const TH={mode:'auto',acc:'',fs:15,dense:0,style:'pro'};
const ACC=[['','Teal'],['#2b6fd1','Biru'],['#7b4cc4','Ungu'],['#c8620a','Oranye'],['#c2386b','Mawar'],['#2f8f3e','Hijau']];
function loadTh(){try{Object.assign(TH,JSON.parse(localStorage.getItem('abs_th')||'{}'))}catch(e){}}
function applyTh(){const r=document.documentElement;
  if(TH.mode==='auto')r.removeAttribute('data-mode');else r.dataset.mode=TH.mode;
  TH.acc?r.style.setProperty('--pri',TH.acc):r.style.removeProperty('--pri');
  r.style.setProperty('--fs',TH.fs+'px');r.dataset.dense=TH.dense;r.dataset.style=TH.style;
  try{localStorage.setItem('abs_th',JSON.stringify(TH))}catch(e){}
  try{const c=getComputedStyle(document.body).backgroundColor.match(/\d+/g).slice(0,3).map(n=>(+n).toString(16).padStart(2,'0')).join('');tg.setHeaderColor('#'+c);tg.setBackgroundColor('#'+c)}catch(e){}}

/* ---------- util ---------- */
const h=(t,c,k,p)=>{const e=document.createElement(t);if(c)e.className=c;[].concat(k==null?[]:k).forEach(x=>x!=null&&x!==false&&e.append(x));if(p)Object.assign(e,p);return e};
const B=(t,c,f)=>h('button','btn '+(c||''),t,{onclick:f});
const bd=s=>h('span','bd '+s,L[s]||s);
const ph=p=>h('span','bd '+p,PH[p]||p);
const fld=(t,pl,p)=>h(t,'',null,Object.assign({placeholder:pl||''},p));
const lab=(t,i)=>h('div','',[h('label','',t),i]);
const sel=(o,v)=>{const s=h('select');o.forEach(([a,b])=>s.append(h('option','',b,{value:a})));s.value=v;return s};
const V=()=>{const v=$('view');v.replaceChildren();return v};
const hap=t=>{try{tg.HapticFeedback.notificationOccurred(t)}catch(e){}};
const dt=x=>new Date(x).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'});
const tm=x=>new Date(x).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
const rng=(a,b)=>{const s=new Date(a),e=new Date(b);return s.toDateString()===e.toDateString()?s.toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'})+', '+tm(s)+'–'+tm(e):dt(s)+' – '+dt(e)};
const loc=d=>{d=new Date(d);const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())};
const cnt=c=>'✅ '+c.hadir+'  ⏰ '+c.terlambat+'  📝 '+c.izin+'  🤒 '+c.sakit+(c.alpa?'  ❌ '+c.alpa:'')+(c.belum?'  ⏳ '+c.belum:'');
const rel=t=>{const m=Math.round((new Date(t)-Date.now())/60000);if(m<=0)return 'sedang berlangsung';if(m<60)return 'mulai '+m+' menit lagi';if(m<1440){const j=Math.floor(m/60),k=m%60;return 'mulai '+j+' jam'+(k?' '+k+' menit':'')+' lagi'}const d=Math.round(m/1440);return d===1?'mulai besok':'mulai '+d+' hari lagi'};
const nudge=(c,n)=>{
  if(n&&(n.myStatus==='hadir'||n.myStatus==='terlambat'))return 'Kehadiranmu di “'+n.name+'” sudah tercatat. Terima kasih sudah hadir! 🙌';
  if(n&&n.phase==='open'&&!n.myStatus)return 'Check-in “'+n.name+'” sudah dibuka. Tinggal satu langkah lagi 😊';
  if(c.streak>=5)return 'Wow, '+c.streak+' kehadiran beruntun. Konsistensimu luar biasa! 🔥';
  if(c.total>=3&&c.pct<60)return 'Tidak apa-apa kalau sempat terlewat. Yuk mulai lagi dari acara berikutnya 💪';
  if(n)return 'Siap-siap ya, “'+n.name+'” '+rel(n.startAt)+'.';
  return 'Hari ini belum ada jadwal. Nikmati waktumu ☕'};
async function sendPdf(a,p){if(S.busy)return;S.busy=true;try{await api(a,p||{});hap('success');info('PDF sudah dikirim ke chat bot. Cek Telegram-mu 📄')}catch(e){hap('error');toast(e.message,'err')}S.busy=false}
function toast(m,t){const e=h('div','t '+(t||''),m);$('toast').append(e);setTimeout(()=>e.remove(),3400)}
function ask(m,cb){if(!DEMO&&tg.showConfirm)tg.showConfirm(m,cb);else cb(confirm(m))}
function info(m,cb){if(!DEMO&&tg.showAlert)tg.showAlert(m,cb);else{toast(m,'ok');cb&&cb()}}
function clr(){if(S.timer){clearInterval(S.timer);S.timer=null}if(S.wl){try{S.wl.release()}catch(e){}S.wl=null}}
function title(t){$('ttl').textContent=t;$('bk').hidden=!S.back;try{S.back?tg.BackButton.show():tg.BackButton.hide()}catch(e){}}
$('bk').onclick=()=>S.back&&S.back();
try{tg.BackButton.onClick(()=>S.back&&S.back())}catch(e){}
const copy=async t=>{try{await navigator.clipboard.writeText(t);toast('Tersalin','ok')}catch(e){prompt('Salin manual:',t)}};
function pos(){return new Promise((ok,no)=>{if(!navigator.geolocation)return no(new Error('Perangkat tidak mendukung lokasi'));navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lng:p.coords.longitude}),e=>no(new Error(e.code===1?'Izin lokasi ditolak. Aktifkan lokasi lalu coba lagi.':'Lokasi belum bisa diambil')),{enableHighAccuracy:true,timeout:12000,maximumAge:0})})}

async function api(a,p={}){
  if(DEMO)return mock(a,p);
  if(/GANTI_DENGAN/.test(API_URL))throw new Error('API_URL belum diisi. Tempel URL Web App hasil Deploy di bagian atas script.');
  if(!navigator.onLine)throw new Error('Kamu sedang offline. Sambungkan internet lalu coba lagi.');
  let r;try{r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:a,initData:tg.initData,...p})})}catch(e){throw new Error('Tidak bisa menjangkau server. Periksa koneksi dan API_URL.')}
  let d;try{d=JSON.parse(await r.text())}catch(e){throw new Error('Server tidak membalas dengan benar (HTTP '+r.status+').')}
  if(!d.ok){const e=new Error(d.error||'Permintaan gagal');e.data=d;throw e}return d}

/* ---------- navigasi ---------- */
const NAV=[['home','🏠','Beranda'],['events','📅','Acara'],['history','🕘','Riwayat'],['groups','👥','Grup',1],['recap','📊','Rekap',1],['log','🛡️','Log',1]];
function nav(){const n=$('nav');n.replaceChildren(h('div','brand','Absensi Pro'));NAV.filter(x=>!x[3]||S.admin).forEach(([k,i,t])=>{const b=h('button',S.view===k?'on':'',[h('i','',i),t],{onclick:()=>go(k)});if(S.view===k)b.setAttribute('aria-current','page');n.append(b)})}
const VIEWS={};
function go(v){S.view=v;S.back=null;nav();run(VIEWS[v])}
function open(id){run(detail,id)}
async function run(fn,...a){clr();S.back=null;S.cur=[fn,a];const my=++S.seq;const v=V();for(let i=0;i<3;i++)v.append(h('div','sk'));try{await fn(my,...a)}catch(e){if(my!==S.seq)return;V().append(h('div','card',[h('b','err','Ups, ada kendala'),h('p','muted',e.message),B('Coba lagi','pri',()=>run(fn,...a))]));title('Terjadi kendala')}}

/* ---------- Beranda ---------- */
VIEWS.home=async my=>{
  const d=await api('dashboard');if(my!==S.seq)return;S.admin=d.isAdmin;nav();
  const u=(tg.initDataUnsafe&&tg.initDataUnsafe.user)||{first_name:'Admin Demo'},hr=new Date().getHours();
  title((hr<11?'Selamat pagi':hr<15?'Selamat siang':hr<18?'Selamat sore':'Selamat malam')+', '+u.first_name);
  const v=V(),c=d.me.counts,n=d.me.next,g=h('div','grid2');
  const nx=h('div','card hero');
  if(n)nx.append(h('div','muted','Acara berikutnya'),h('h2','',n.name),h('span','chip','⏳ '+(n.phase==='open'?'Check-in dibuka · ':'')+rel(n.startAt)),h('div','muted','🕒 '+rng(n.startAt,n.endAt)+(n.location?'  📍 '+n.location:'')),h('div','',[ph(n.phase),n.myStatus&&bd(n.myStatus)]),
    h('div','btns',[B(n.phase==='open'&&!n.myStatus?'Check-in sekarang':'Lihat detail','pri',()=>open(n.id))]));
  else nx.append(h('h2','','Belum ada acara terdekat'),h('p','muted','Jadwal kosong dulu. Nikmati waktu luangmu ☕'),S.admin&&h('div','btns',[B('Buat acara','pri',()=>form())]));
  const me=h('div','card row');const ring=h('div','ring',[h('b','',c.total?c.pct+'%':'–')]);ring.style.setProperty('--p',c.pct||0);
  me.append(ring,h('div','',[h('b','','Kehadiranmu'),h('div','muted',c.total?cnt(c):'Belum ada riwayat'),c.streak>1&&h('div','ok','🔥 '+c.streak+' kehadiran beruntun')]));
  g.append(nx,me);v.append(h('p','nudge',nudge(c,n)),g);
  d.insights.forEach(i=>v.append(h('div','tip '+i.tone,i.text)));
  if(d.admin){const a=d.admin;
    v.append(h('h3','','Ringkasan admin'),h('div','stats',[['Berlangsung',a.openNow],['Akan datang',a.upcoming],['Grup',a.groups],['Rata-rata bulan ini',a.avg==null?'–':a.avg+'%']].map(([t,x])=>h('div','card stat',[h('b','',x),h('span','muted',t)]))));
    const rk=h('div','card',[h('b','','Perlu perhatian bulan ini')]);
    if(!a.risk.length)rk.append(h('p','muted','Tidak ada anggota dengan kehadiran rendah. 👍'));
    a.risk.forEach(p=>rk.append(h('div','att row',[h('span','',p.name+' · '+p.group),h('b','err',p.pct+'% ('+p.alpa+'× alpa)')])));
    v.append(rk,h('div','btns',[B('＋ Acara baru','pri',()=>form()),B('Kelola grup','',()=>go('groups'))]))}
};

/* ---------- Acara ---------- */
function evCard(ev){
  const c=h('div','card click',[h('div','row',[h('b','',ev.name),ph(ev.phase)]),
    ev.groupName&&h('span','bd grp','👥 '+ev.groupName),ev.inSeries&&h('span','bd upcoming','🔁 berulang'),
    h('div','muted','🕒 '+rng(ev.startAt,ev.endAt)),ev.location&&h('div','muted','📍 '+ev.location),ev.myStatus&&bd(ev.myStatus),ev.counts&&h('div','muted',cnt(ev.counts))],{onclick:()=>open(ev.id)});return c}
let st;
